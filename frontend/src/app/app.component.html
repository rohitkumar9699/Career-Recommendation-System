<main class="app-shell" [class.dark-theme]="darkMode">
  <header class="topbar">
    <a class="brand" (click)="go('welcome')"><span class="brand-mark">CR</span><span>CareerRoute</span></a>
    <nav>
      <button class="link-button" *ngIf="view === 'student' || view === 'assessment' || view === 'update'" (click)="go('student')">Dashboard</button>
      <button class="link-button" *ngIf="view === 'student'" (click)="openUpdateDetails()">Update details</button>
      <span class="marks-chip" *ngIf="student?.assessment_result as result">Marks {{ result.total_score }} / 700</span>
      <button class="link-button" (click)="toggleTheme()">{{ darkMode ? 'Light mode' : 'Dark mode' }}</button>
      <button class="link-button" *ngIf="view === 'student' || view === 'assessment' || view === 'update'" (click)="logout()">Sign out</button>
    </nav>
  </header>

  <section class="notice success" *ngIf="message">{{ message }}</section>
  <section class="notice error" *ngIf="error">{{ error }}</section>
  <div class="loading-backdrop" *ngIf="isSubmitting" role="status" aria-live="polite"><div class="loading-popup"><span class="spinner"></span><strong>Submitting your results</strong><p>Generating your recommendations...</p></div></div>

  <app-welcome *ngIf="view === 'welcome'" (navigate)="go($event)"></app-welcome>

  <section class="auth-layout" *ngIf="view === 'login' || view === 'register'">
    <div class="auth-intro"><p class="eyebrow">CAREERROUTE</p><h1>Start with a<br><em>clear signal.</em></h1><p>Your academic profile is more than a score. Tell us how you work, and we will surface the directions worth exploring.</p></div>
    <app-login *ngIf="view === 'login'" (navigate)="go($event)" (success)="handleLogin($event)" (failure)="error = $event"></app-login>
    <app-register *ngIf="view === 'register'" (navigate)="go($event)" (success)="handleRegister($event)" (failure)="error = $event"></app-register>
  </section>

  <app-dashboard *ngIf="view === 'student' && student" [student]="student" (assessment)="loadAssessment()" (update)="openUpdateDetails()"></app-dashboard>

  <app-update-profile *ngIf="view === 'update' && student" [profile]="profileData" (cancel)="go('student')" (success)="handleProfileUpdate($event)" (failure)="error = $event"></app-update-profile>

  <app-assessment *ngIf="view === 'assessment'" (success)="handleAssessment($event)" (failure)="error = $event" (submitting)="isSubmitting = $event"></app-assessment>

</main>
