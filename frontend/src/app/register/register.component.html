<div class="form-panel"><div class="panel-top"><span>NEW STUDENT</span><button class="text-action" (click)="navigate.emit('login')">Sign in →</button></div><h2>Create your profile</h2><p class="muted">One account. One focused assessment.</p><form (ngSubmit)="submit()"><div class="form-grid"><label>Name<input name="username" [(ngModel)]="registerData.username" required></label><label>Gender<select name="gender" [(ngModel)]="registerData.gender"><option value="male">Male</option><option value="female">Female</option></select></label></div><label>Email<input type="email" name="email" [(ngModel)]="registerData.email" required></label><div class="form-grid"><label>Mobile<input name="mobile" [(ngModel)]="registerData.mobile" required></label><label>Password<input type="password" name="password" [(ngModel)]="registerData.password" required></label></div><button class="button primary full" type="submit">Create account <span>→</span></button></form></div>
