<section class="update-page"><div class="assessment-head"><div><p class="eyebrow">PROFILE / UPDATE DETAILS</p><h1>Keep your<br><em>details current.</em></h1></div><p class="lead">This section updates only your personal details. Your test results and recommendations remain unchanged.</p></div><form class="form-panel update-panel" (ngSubmit)="update()"><label>Name<input name="profileName" [(ngModel)]="profile.name" required></label><label>Mobile<input name="profileMobile" [(ngModel)]="profile.mobile" required pattern="[0-9]{10}"></label><div class="update-actions"><button class="button outline" type="button" (click)="cancel.emit()">Cancel</button><button class="button primary" type="submit">Save details <span>→</span></button></div></form></section>
